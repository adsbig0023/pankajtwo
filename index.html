body{
    background:#001f16;

    min-height:100vh;

}

.container{
    width:100%;
    max-width:830px;
    margin:auto;
    padding:38px 35px 55px;
    text-align:center;
}

/* PROFILE */

.profile{
    width:205px;
    height:205px;
    margin:0 auto 32px;
    padding:7px;
    border-radius:50%;

    background:#d8b42d;

    box-shadow:
    0 0 0 9px rgba(216,180,45,.13);
}

.profile img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    display:block;
    border:3px solid #092c21;
}

/* NAME */

h1{
    font-family:Georgia,serif;
    font-size:48px;
    line-height:1;
    margin-bottom:38px;
    color:#f5f5ef;
}

/* 3 BOX */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:40px;
}

.stat{
    height:130px;
    border-radius:25px;
    background:#0b392c;
    border:1.5px solid #806d1d;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.stat strong{
    font-size:27px;
    color:#f2dfa0;
    margin-bottom:18px;
}

.stat span{
    font-size:19px;
    color:#aebbb5;
}

/* TELEGRAM */

.telegram-wrap{
    padding:10px;
    border-radius:55px;
    background:rgba(2,37,27,.75);
    margin-bottom:43px;
}

.telegram-btn{
    height:95px;
    width:100%;

    border-radius:50px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;

    text-decoration:none;

    background:linear-gradient(
        100deg,
        #f5e5a7,
        #dfba32
    );

    color:#06271d;
    font-size:29px;
    font-weight:bold;
}

.telegram-btn i{
    font-size:36px;
}

/* SECTION TITLE */

.section-title{
    text-align:left;
    font-size:19px;
    letter-spacing:4px;
    color:#89958f;
    margin-bottom:25px;
    font-weight:bold;
}

/* FEATURES */

.features{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.feature{
    height:105px;

    border-radius:24px;
    background:#0b392c;
    border:1.5px solid #806d1d;

    display:flex;
    align-items:center;

    text-align:left;
    padding:0 38px;

    font-size:24px;
}

.dot{
    width:15px;
    height:15px;
    min-width:15px;

    background:#e2b82b;
    border-radius:50%;

    margin-right:28px;
}

/* ADS MANAGED */

.agency{
    margin-top:100px;
    font-size:21px;
    color:#c1c9c5;
}

.agency a{
    color:#d7ae27;
    text-decoration:none;
    font-weight:bold;
}

.rocket{
    margin-right:7px;
}

    }

}
